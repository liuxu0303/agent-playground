<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-playground</title>
<style>
  :root { color-scheme: light dark; --line: #d0d7de; --muted: #656d76; }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto; padding: 2rem 1rem; max-width: 42rem;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .hint { color: var(--muted); margin: 0 0 1.5rem; font-size: .875rem; }
  form { display: flex; gap: .5rem; }
  input[type=text] {
    flex: 1; padding: .5rem .75rem; font: inherit;
    border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit;
  }
  button {
    padding: .5rem .875rem; font: inherit; cursor: pointer;
    border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit;
  }
  button:hover { border-color: var(--muted); }
  ul { list-style: none; margin: 1.5rem 0 0; padding: 0; }
  li {
    display: flex; align-items: center; gap: .75rem;
    padding: .625rem 0; border-bottom: 1px solid var(--line);
  }
  li .title { flex: 1; }
  li.done .title { text-decoration: line-through; color: var(--muted); }
  li input[type=date] {
    padding: .25rem .5rem; font: inherit; color: var(--muted);
    border: 1px solid transparent; border-radius: 6px; background: transparent;
  }
  li input[type=date]:hover, li input[type=date]:focus { border-color: var(--line); color: inherit; }
  .empty { color: var(--muted); padding: 1.5rem 0; text-align: center; }
  .error { color: #cf222e; font-size: .875rem; min-height: 1.25rem; margin: .5rem 0 0; }
</style>
</head>
<body>
<h1>agent-playground</h1>
<p class="hint">A demo task board. The API lives under <code>/api/tasks</code>.</p>

<form id="new">
  <input id="title" type="text" placeholder="What needs doing?" autocomplete="off" required>
  <input id="due" type="date" aria-label="Due date" title="Due date">
  <button type="submit">Add</button>
</form>
<p class="error" id="error"></p>

<ul id="list"></ul>

<script>
const list = document.getElementById('list');
const error = document.getElementById('error');

async function api(path, options) {
  const response = await fetch(path, options);
  if (response.status === 204) return null;
  const body = await response.json();
  if (!response.ok) throw new Error(body.error || response.statusText);
  return body;
}

async function load() {
  const { tasks } = await api('/api/tasks');
  list.replaceChildren();
  if (!tasks.length) {
    const empty = document.createElement('li');
    empty.className = 'empty';
    empty.textContent = 'No tasks yet.';
    list.append(empty);
    return;
  }
  for (const task of tasks) list.append(row(task));
}

function row(task) {
  const item = document.createElement('li');
  if (task.done) item.classList.add('done');

  const toggle = document.createElement('input');
  toggle.type = 'checkbox';
  toggle.checked = task.done;
  toggle.addEventListener('change', async () => {
    await api('/api/tasks/' + task.id, {
      method: 'PATCH',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ done: toggle.checked }),
    }).then(load).catch(show);
  });

  const title = document.createElement('span');
  title.className = 'title';
  title.textContent = task.title;

  const due = document.createElement('input');
  due.type = 'date';
  due.className = 'due';
  due.value = task.due || '';
  due.setAttribute('aria-label', 'Due date');
  due.title = 'Due date';
  due.addEventListener('change', async () => {
    await api('/api/tasks/' + task.id, {
      method: 'PATCH',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ due: due.value || null }),
    }).then(load).catch(show);
  });

  const remove = document.createElement('button');
  remove.textContent = 'Remove';
  remove.addEventListener('click', async () => {
    await api('/api/tasks/' + task.id, { method: 'DELETE' }).then(load).catch(show);
  });

  item.append(toggle, title, due, remove);
  return item;
}

function show(err) {
  error.textContent = err.message;
}

document.getElementById('new').addEventListener('submit', async event => {
  event.preventDefault();
  const input = document.getElementById('title');
  const due = document.getElementById('due');
  try {
    await api('/api/tasks', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ title: input.value, due: due.value || null }),
    });
    input.value = '';
    due.value = '';
    error.textContent = '';
    await load();
  } catch (err) {
    show(err);
  }
});

load().catch(show);
</script>
</body>
</html>
